name: Deploy dashboards to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "feri-alb-toolkit/feri/dashboard/feri_dashboard_public.html"
      - "feri-alb-toolkit/alb/dashboard/cplex_results_dashboard.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp feri-alb-toolkit/feri/dashboard/feri_dashboard_public.html _site/index.html
          cp feri-alb-toolkit/alb/dashboard/cplex_results_dashboard.html _site/cplex.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
